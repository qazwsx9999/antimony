name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sbc.exe (warnings as errors)
        shell: cmd
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror src\util.c src\lexer.c src\parser.c src\check.c src\x64.c src\codegen.c src\pe.c src\llvm_c.c src\fmt.c src\main.c -o sbc.exe

      - name: Run self-hosted stdlib tests & full test suite
        shell: pwsh
        run: |
          .\sbc.exe --version
          .\sbc.exe test tests\stdlib_test.sb
          .\sbc.exe test tests\stdlib_test.sb --llvm
          powershell -ExecutionPolicy Bypass -File tests\run_tests.ps1

      - name: Package Windows x64 archive and SHA-256 checksum
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $stage = "dist\antimony-$tag-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item sbc.exe, README.md, CHANGELOG.md, LICENSE $stage
          Copy-Item -Recurse std, docs, examples $stage
          $zip = "dist\antimony-$tag-windows-x64.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  antimony-$tag-windows-x64.zip" | Set-Content -Path "$zip.sha256" -Encoding ASCII

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/antimony-*-windows-x64.zip
            dist/antimony-*-windows-x64.zip.sha256
