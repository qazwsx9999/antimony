name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sbc.exe (warnings as errors)
        shell: cmd
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror src\util.c src\lexer.c src\parser.c src\check.c src\x64.c src\codegen.c src\pe.c src\llvm_c.c src\fmt.c src\main.c -o sbc.exe

      - name: Run self-hosted stdlib tests & full test suite
        shell: pwsh
        run: |
          .\sbc.exe --version
          .\sbc.exe test tests\stdlib_test.sb
          .\sbc.exe test tests\stdlib_test.sb --llvm
          powershell -ExecutionPolicy Bypass -File tests\run_tests.ps1

      - name: Package Windows x64 archive and SHA-256 checksum
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $stage = "dist\antimony-$tag-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item sbc.exe, README.md, CHANGELOG.md, LICENSE $stage
          Copy-Item -Recurse std, docs, examples $stage
          $zip = "dist\antimony-$tag-windows-x64.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  antimony-$tag-windows-x64.zip" | Set-Content -Path "$zip.sha256" -Encoding ASCII

      - name: Publish Windows Release Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/antimony-*-windows-x64.zip
            dist/antimony-*-windows-x64.zip.sha256

  release-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Build sbc on Linux x64 (warnings as errors)
        run: make CFLAGS="-std=c11 -O2 -Wall -Wextra -Werror"

      - name: Run Linux x64 cross-platform stdlib, CLI, HTTP server & FFI tests
        run: |
          ./sbc --version
          ./sbc test tests/linux_test.sb
          ./sbc test tests/linux_test.sb --release
          ./sbc run examples/sbwc.sb
          ./sbc run examples/sbhttpd.sb
          out=$(./sbc run tests/linux_ffi_test.sb)
          test "$out" = "linux_ffi_ok=12 14"

      - name: Package Linux x64 archive and SHA-256 checksum
        run: |
          tag="${GITHUB_REF_NAME}"
          stage="dist/antimony-${tag}-linux-x64"
          mkdir -p "${stage}"
          cp sbc README.md CHANGELOG.md LICENSE "${stage}/"
          cp -r std docs examples "${stage}/"
          tar -czf "dist/antimony-${tag}-linux-x64.tar.gz" -C dist "antimony-${tag}-linux-x64"
          (cd dist && sha256sum "antimony-${tag}-linux-x64.tar.gz" > "antimony-${tag}-linux-x64.tar.gz.sha256")

      - name: Publish Linux Release Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/antimony-*-linux-x64.tar.gz
            dist/antimony-*-linux-x64.tar.gz.sha256
