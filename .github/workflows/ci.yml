name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sbc (MinGW-w64 GCC, warnings as errors)
        shell: cmd
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror src\util.c src\lexer.c src\parser.c src\check.c src\x64.c src\codegen.c src\pe.c src\llvm_c.c src\fmt.c src\main.c -o sbc.exe

      - name: Verify CLI version and formatting
        shell: pwsh
        run: |
          .\sbc.exe --version
          $pal = Get-ChildItem -Path std\pal -Filter *.sb | ForEach-Object { $_.FullName }
          .\sbc.exe fmt --check tests\stdlib_test.sb tests\linux_test.sb @pal

      - name: Run self-hosted unit tests (sbc test)
        shell: pwsh
        run: |
          .\sbc.exe test tests\stdlib_test.sb
          .\sbc.exe test tests\stdlib_test.sb --llvm
          .\sbc.exe test tests\linux_test.sb

      - name: Run full compiler & backend test suite (Native x64 & LLVM -O3)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tests\run_tests.ps1

      - name: Run example programs
        shell: pwsh
        run: |
          .\sbc.exe run examples\demo.sb
          .\sbc.exe run examples\sbwc.sb
          .\sbc.exe run examples\sbhttpd.sb

  build-and-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Build sbc on Linux x64 (warnings as errors)
        run: make CFLAGS="-std=c11 -O2 -Wall -Wextra -Werror"

      - name: Verify CLI version, formatting, and cross-platform type-checking
        run: |
          ./sbc --version
          ./sbc fmt --check tests/stdlib_test.sb tests/linux_test.sb std/pal/*.sb
          for mod in core mem vec map set deque heap sort str path math time rand encoding hash json io bufio fs os testing; do
            ./sbc check --lib "std/${mod}.sb"
          done

      - name: Run Antimony cross-platform stdlib tests on Linux x64 (debug & -O3 release)
        run: |
          ./sbc test tests/linux_test.sb
          ./sbc test tests/linux_test.sb --release

      - name: Run real CLI example natively on Linux x64 (examples/sbwc.sb)
        run: |
          ./sbc run examples/sbwc.sb

      - name: Run Linux ELF shared-library FFI test (libm.so.6 & libc.so.6)
        run: |
          out=$(./sbc run tests/linux_ffi_test.sb)
          echo "$out"
          test "$out" = "linux_ffi_ok=12 14"

      - name: Cross-compile Windows PE32+ .exe directly from Linux
        run: |
          ./sbc build examples/demo.sb --target windows-x64 -o /tmp/demo_win64.exe
          head -c 2 /tmp/demo_win64.exe | grep -q "MZ"
          rm -f /tmp/demo_win64.exe
